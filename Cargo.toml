[package]
name = "absolem"
version = "0.1.0"
edition = "2024"
license = "TBD"
repository = "TBD"
description = "Surface the structural shape of a change before review."

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.29"
serde_json = "1.0"
thiserror = "1.0"
tree-sitter = "0.24"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"

[lints.clippy]
# Groups (priority -1 so individual lints below can override them).
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

# --- Pedantic lints that are usually more noise than signal ---
module_name_repetitions  = "allow"  # foo::FooError is fine
must_use_candidate       = "allow"
missing_errors_doc       = "allow"  # revisit when there's a public library boundary
missing_panics_doc       = "allow"
cast_precision_loss      = "allow"
cast_possible_truncation = "allow"

# --- Cargo lints that fire on placeholder metadata while license/repo are TBD ---
cargo_common_metadata    = "allow"
multiple_crate_versions  = "allow"  # tree-sitter pulls duplicate semver versions

# --- Nursery lints that conflict with STYLE §5 in a bin crate ---
# STYLE says "default to pub(crate); promote to pub only when intended surface."
# redundant_pub_crate flags pub(crate) inside private modules as noise — but
# combined with unreachable_pub (which would warn on pub items in a bin crate
# since they're unreachable externally), the convention has nowhere to land.
# STYLE wins; the lint loses.
redundant_pub_crate      = "allow"

# --- Cherry-picked restriction lints ---
dbg_macro          = "warn"
todo               = "warn"
unimplemented      = "warn"
unwrap_used        = "warn"
expect_used        = "warn"
panic              = "warn"
mem_forget         = "warn"
float_cmp_const    = "warn"
str_to_string      = "warn"  # string_to_string was renamed/removed; implicit_clone (pedantic) now covers it

# --- Capability-injection backstop (docs/STYLE.md §3) ---
# These catch ambient effects in code that should take a capability instead.
print_stdout       = "warn"
print_stderr       = "warn"
exit               = "warn"

[lints.rust]
unsafe_code        = "forbid"
unreachable_pub    = "warn"
